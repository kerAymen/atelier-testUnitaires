name: Compilation du projet atelier-test-unitaires

on: 
  push: 
jobs:
    compilation: #Nom du premier job qui s'execute sur un runner ubuntu
       runs-on: ubuntu-latest
       #
       steps:
            - name: Va chercher le code source du projet
              uses: actions/checkout@v5
            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                java-version: '25'
                distribution: 'temurin'
            - name: Ajouter droit pour la compilation
              run: chmod +x ./mvnw
            - name: Compile le projet
              run: ./mvnw -B verify